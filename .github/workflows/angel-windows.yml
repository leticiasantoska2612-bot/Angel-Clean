name: Angel - Windows x64

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSVC x64
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Check compiler and tools
        shell: pwsh
        run: |
          where.exe cl
          where.exe ninja
          where.exe rc
          cmake --version

      # Ninja uses the MSVC environment set up above without requiring
      # CMake to locate a Visual Studio IDE instance.
      - name: Configure CMake (Ninja / Release)
        shell: pwsh
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        shell: pwsh
        run: cmake --build build --parallel 2

      - name: Upload artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Angel-x64
          path: build/bin/
          if-no-files-found: error
